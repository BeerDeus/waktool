<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waktool · Métiers Wakfu</title>
  <meta name="description" content="Wakfu : ressources, zones, XP, plans de montée, recettes, rentabilité et sessions de farm pour chaque métier.">
  <link rel="icon" href="img/app/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Waktool">
  <script>
    // thème appliqué avant le rendu (évite le flash)
    try { const t = localStorage.getItem('waktool.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/style.css?v=027bba66">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">W</span>
      <div>
        <h1>Waktool</h1>
        <p>Métiers Wakfu</p>
      </div>
    </div>
    <nav class="mainnav" id="mainnav" aria-label="Sections">
      <button type="button" data-page="metiers"><span aria-hidden="true">📚</span> Métiers</button>
      <button type="button" data-page="rentabilite"><span aria-hidden="true">💰</span> Rentabilité</button>
      <button type="button" data-page="zones"><span aria-hidden="true">🧭</span> Zones</button>
      <button type="button" data-page="session"><span aria-hidden="true">⏱</span> Session<span class="live-dot" id="live-dot" hidden></span></button>
    </nav>
    <div class="hright">
      <div id="account" class="account"></div>
      <button id="install-btn" class="gbtn small" type="button" hidden title="Installer Waktool comme une application">⤓ Installer</button>
      <button id="theme-btn" class="theme-btn" type="button"></button>
    </div>
  </header>

  <div class="jobbar" id="jobbar">
    <nav id="tabs" class="tabs" role="tablist"></nav>
    <div id="crafts-dd" class="crafts-dd">
      <button id="dd-btn" class="dd-btn" type="button" aria-haspopup="true" aria-expanded="false">Artisanat ▾</button>
      <div id="dd-menu" class="dd-menu" hidden></div>
    </div>
  </div>

  <main class="layout" id="layout">
    <section class="main">
      <!-- page Métiers -->
      <div id="page-metiers">
        <div class="jobcard" id="job-head"></div>
        <nav class="subtabs" id="subtabs" role="tablist"></nav>
        <div class="filters" id="filters">
          <label class="search">
            <input id="q" type="search" placeholder="Rechercher une ressource, une zone…" autocomplete="off">
          </label>
          <label class="chk"><input id="only" type="checkbox"> <span id="only-lbl">Accessibles seulement</span></label>
          <select id="rtype" class="rtype" hidden title="Type de recettes">
            <option value="all">Toutes les recettes</option>
            <option value="craft">Fabrication</option>
            <option value="up">Améliorations de rareté</option>
          </select>
        </div>
        <div id="list" class="list"></div>
      </div>
      <!-- page Rentabilité -->
      <div id="page-rentabilite" hidden></div>
      <!-- page Zones -->
      <div id="page-zones" hidden></div>
      <!-- page Session -->
      <div id="page-session" hidden></div>
    </section>

    <aside class="side" id="side"></aside>
  </main>

  <footer class="foot">
    <p>Données : <a href="https://methodwakfu.com/artisanat/localisation-des-ressources/" target="_blank" rel="noopener">MethodWakfu</a>,
      gamedata Ankama <span id="ver"></span>, <a href="https://wakfu.wiki.gg" target="_blank" rel="noopener">Wakfu Wiki</a>.
      Images © Ankama. Site non officiel. · <button type="button" class="lnk" id="import-btn">Importer une capture (Ctrl+V)</button></p>
  </footer>

  <template id="tpl-res">
    <article class="res">
      <div class="res-lvl"></div>
      <div class="res-app"></div>
      <div class="res-body">
        <h3></h3>
        <ul class="zones"></ul>
        <div class="drops"></div>
      </div>
    </article>
  </template>

  <script src="data/crafts.js?v=ea2345be"></script>
  <script src="data/metiers.js?v=18b957f8"></script>
  <script type="module" src="assets/js/main.js?v=aec81dce"></script>
  <script type="module" src="assets/import.js?v=7ea9c640"></script>
  <script type="module" src="assets/auth.js?v=d26f6e14"></script>
</body>
</html>
