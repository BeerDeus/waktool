<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waktool · Métiers de récolte</title>
  <meta name="description" content="Wakfu : zones de récolte, niveaux, outils, familiers et consommables pour chaque métier de récolte.">
  <link rel="icon" href="img/app/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Waktool">
  <script>
    // thème appliqué avant le rendu (évite le flash)
    try { const t = localStorage.getItem('waktool.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/style.css?v=6181f99c">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">W</span>
      <div>
        <h1>Waktool</h1>
        <p>Métiers de récolte Wakfu</p>
      </div>
    </div>
    <nav id="tabs" class="tabs" role="tablist"></nav>
    <div id="crafts-dd" class="crafts-dd">
      <button id="dd-btn" class="dd-btn" type="button" aria-haspopup="true" aria-expanded="false">Artisanat ▾</button>
      <div id="dd-menu" class="dd-menu" hidden></div>
    </div>
    <div id="account" class="account"></div>
    <button id="install-btn" class="gbtn small" type="button" hidden title="Installer Waktool comme une application">⤓ Installer</button>
    <button id="theme-btn" class="theme-btn" type="button"></button>
  </header>

  <main class="layout">
    <section class="main">
      <div class="job-head" id="job-head"></div>
      <div class="filters">
        <label class="search">
          <input id="q" type="search" placeholder="Rechercher une ressource, une zone…" autocomplete="off">
        </label>
        <label class="lvl">
          Mon niveau <input id="lvl" type="number" min="0" max="200" step="1" placeholder="—">
        </label>
        <label class="chk"><input id="only" type="checkbox"> <span id="only-lbl">Récoltable seulement</span></label>
        <select id="rtype" class="rtype" hidden title="Type de recettes">
          <option value="all">Toutes les recettes</option>
          <option value="craft">Fabrication</option>
          <option value="up">Améliorations de rareté</option>
        </select>
        <button id="import-btn" class="gbtn small" type="button" title="Importer mes niveaux depuis une capture d'écran (Ctrl+V)">Importer une capture</button>
      </div>
      <div id="list" class="list"></div>
    </section>

    <aside class="side" id="side"></aside>
  </main>

  <footer class="foot">
    <p>Données : <a href="https://methodwakfu.com/artisanat/localisation-des-ressources/" target="_blank" rel="noopener">MethodWakfu</a>,
      gamedata Ankama <span id="ver"></span>, <a href="https://wakfu.wiki.gg" target="_blank" rel="noopener">Wakfu Wiki</a>.
      Images © Ankama. Site non officiel.</p>
  </footer>

  <template id="tpl-res">
    <article class="res">
      <div class="res-lvl"></div>
      <div class="res-app"></div>
      <div class="res-body">
        <h3></h3>
        <ul class="zones"></ul>
        <div class="drops"></div>
      </div>
    </article>
  </template>

  <script src="data/crafts.js?v=ea2345be"></script>
  <script src="data/metiers.js?v=18b957f8"></script>
  <script src="assets/app.js?v=117e3187"></script>
  <script src="assets/import.js?v=0263b7fa"></script>
  <script type="module" src="assets/auth.js?v=d26f6e14"></script>
</body>
</html>
